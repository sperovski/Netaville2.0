<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Netaville — boot sequence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{ --page:#f2f0f6; --page-text:#1a1524; --stage:#07030F; --ink:#2500CA; --cyan:#01BEFE; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --page:#0d0a14; --page-text:#e9e6f2; }
  }
  :root[data-theme="dark"]{ --page:#0d0a14; --page-text:#e9e6f2; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--page);color:var(--page-text);
    font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;}

  .stage{position:relative;width:min(560px,92vw);aspect-ratio:1/1;background:var(--stage);
    border-radius:4px;overflow:hidden;isolation:isolate;}
  .stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
    background:repeating-linear-gradient(to bottom,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);
    mix-blend-mode:overlay;}
  .glow{position:absolute;inset:0;z-index:0;opacity:0;
    background:radial-gradient(circle at 50% 47%, rgba(37,0,202,.6), transparent 62%);}
  .flash{position:absolute;inset:0;z-index:4;background:#fff;opacity:0;pointer-events:none}
  .sweep{position:absolute;left:0;right:0;top:0;height:2px;z-index:3;opacity:0;
    background:linear-gradient(90deg,transparent,var(--cyan),transparent);box-shadow:0 0 18px var(--cyan)}
  svg{position:absolute;inset:0;width:100%;height:100%;z-index:2}

  .run .glow{animation:glowUp .8s .05s ease-out forwards, breathe 5s 3.2s ease-in-out infinite}
  .run .sweep{animation:sweep 1.05s .08s cubic-bezier(.5,0,.2,1) forwards}
  .run .flash{animation:flash .5s 2.5s ease-out forwards}
  .run #mark{animation:settle .85s 2.45s cubic-bezier(.2,1.35,.35,1) both}

  .run .slab   {animation:slab .55s .22s cubic-bezier(.16,1,.3,1) both}
  .run .p-cyan {animation:inLeft  .6s .52s cubic-bezier(.16,1,.3,1) both}
  .run .p-grey {animation:inLeft  .6s .62s cubic-bezier(.16,1,.3,1) both}
  .run .p-yellow{animation:inUp   .6s .58s cubic-bezier(.16,1,.3,1) both}
  .run .p-coral{animation:inRight .6s .68s cubic-bezier(.16,1,.3,1) both}
  .run .p-core {animation:fade .4s .8s ease-out both}

  .run .ray  {animation:fan .5s cubic-bezier(.2,.9,.3,1) both}
  .run .trace{animation:fade .45s ease-out both}
  .run .dot  {animation:pop .32s cubic-bezier(.2,1.6,.4,1) both}
  .run .glyph{animation:rise .55s cubic-bezier(.16,1,.3,1) both}
  .run .ray:nth-child(1){animation-delay:1.14s}
  .run .ray:nth-child(2){animation-delay:1.21s}
  .run .ray:nth-child(3){animation-delay:1.28s}
  .run .ray:nth-child(4){animation-delay:1.35s}
  .run .ray:nth-child(5){animation-delay:1.42s}
  .run .ray:nth-child(6){animation-delay:1.49s}
  .run .trace:nth-child(1){animation-delay:1.30s}
  .run .trace:nth-child(2){animation-delay:1.37s}
  .run .trace:nth-child(3){animation-delay:1.44s}
  .run .trace:nth-child(4){animation-delay:1.51s}
  .run .trace:nth-child(5){animation-delay:1.58s}
  .run .trace:nth-child(6){animation-delay:1.65s}
  .run .dot:nth-child(1){animation-delay:1.24s}
  .run .dot:nth-child(2){animation-delay:1.29s}
  .run .dot:nth-child(3){animation-delay:1.34s}
  .run .dot:nth-child(4){animation-delay:1.39s}
  .run .dot:nth-child(5){animation-delay:1.44s}
  .run .dot:nth-child(6){animation-delay:1.49s}
  .run .glyph:nth-child(1){animation-delay:2.02s}
  .run .glyph:nth-child(2){animation-delay:2.07s}
  .run .glyph:nth-child(3){animation-delay:2.12s}
  .run .glyph:nth-child(4){animation-delay:2.17s}
  .run .glyph:nth-child(5){animation-delay:2.22s}
  .run .glyph:nth-child(6){animation-delay:2.27s}
  .run .glyph:nth-child(7){animation-delay:2.32s}
  .run .glyph:nth-child(8){animation-delay:2.37s}
  .run .glyph:nth-child(9){animation-delay:2.42s}
  .run .glyph:nth-child(10){animation-delay:2.47s}

  .run .shock{animation:shock .95s 1.85s cubic-bezier(.2,.6,.2,1) both}
  .run .core {animation:core .5s 1.72s cubic-bezier(.2,1.6,.35,1) both}

  @keyframes glowUp{from{opacity:0}to{opacity:.55}}
  @keyframes breathe{0%,100%{opacity:.42}50%{opacity:.66}}
  @keyframes sweep{0%{opacity:0;transform:translateY(0)}12%{opacity:1}88%{opacity:1}100%{opacity:0;transform:translateY(560px)}}
  @keyframes flash{0%{opacity:0}18%{opacity:.8}100%{opacity:0}}
  @keyframes settle{0%{transform:translate(92px,81px) scale(1.035)}60%{transform:translate(92px,81px) scale(.997)}100%{transform:translate(92px,81px) scale(1)}}
  @keyframes slab{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
  @keyframes inLeft {from{transform:translateX(-130px);opacity:0}to{transform:none;opacity:1}}
  @keyframes inRight{from{transform:translateX(150px);opacity:0}to{transform:none;opacity:1}}
  @keyframes inUp   {from{transform:translateY(-140px);opacity:0}to{transform:none;opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes fan{from{opacity:0;transform:translate(-14px,10px) scale(.9)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
  @keyframes rise{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
  @keyframes core{0%{transform:scale(0)}70%{transform:scale(1.16)}100%{transform:scale(1)}}
  @keyframes shock{from{transform:scale(1);opacity:.9}to{transform:scale(3.2);opacity:0}}

  .slab,.p-cyan,.p-grey,.p-yellow,.p-coral,.p-core,.ray,.trace,.dot,.glyph,.core,.shock{
    transform-box:fill-box;transform-origin:center}
  #mark{transform-box:view-box}

  .controls{display:flex;gap:10px}
  button{font:inherit;font-weight:500;font-size:14px;padding:10px 22px;border-radius:999px;
    cursor:pointer;border:1.5px solid currentColor;background:transparent;color:var(--page-text);
    transition:background .18s ease,color .18s ease,border-color .18s ease}
  button:hover{background:var(--ink);border-color:var(--ink);color:#fff}
  button:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){
    .run *{animation-duration:.01ms !important;animation-delay:0s !important}
    .run .glow{opacity:.5}
  }
</style>
</head>

<script>
  const stage=document.getElementById('stage');
  document.getElementById('replay').addEventListener('click',()=>{
    stage.classList.remove('run'); void stage.offsetWidth; stage.classList.add('run');
  });
</script>
